<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BTC Gráficos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una barra superior compacta (pestañas a la izquierda, precio + actualizar a la derecha), una fila de herramientas,
   y el gráfico ocupando casi todo; la leyenda (símbolo, OHLC e indicadores) vive dentro del gráfico. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#141a22; --muted:#5f6b7a; --grid:#eef0f3; --line:#d9dde3;
  --up:#089981; --down:#e5484d; --warn:#c27c0e; --bmsb-sma:#d9534f; --bmsb-ema:#2e9d55; --rsi:#7e57c2; --chip:#eef1f5; --accent:#2962ff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#151a21; --fg:#e4e8ee; --muted:#8b96a5; --grid:#1c232b; --line:#2a323d;
  --up:#26a69a; --down:#ef5350; --warn:#f0b33a; --bmsb-sma:#ef6b66; --bmsb-ema:#4cc27a; --rsi:#a78bfa; --chip:#1d242d; --accent:#5b8cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#151a21; --fg:#e4e8ee; --muted:#8b96a5; --grid:#1c232b; --line:#2a323d;
  --up:#26a69a; --down:#ef5350; --warn:#f0b33a; --bmsb-sma:#ef6b66; --bmsb-ema:#4cc27a; --rsi:#a78bfa; --chip:#1d242d; --accent:#5b8cff; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 20px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:8px}
button{font-family:var(--sans)}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.tabs{display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap;min-width:0}
.tab{display:flex;align-items:center;border-bottom:2px solid transparent}
.tab[data-on="1"]{border-bottom-color:var(--accent)}
.tab [role=tab]{font:500 14px var(--mono);background:none;border:0;color:var(--muted);padding:8px 10px;cursor:pointer}
.tab[data-on="1"] [role=tab]{color:var(--fg)}
.tab .tx{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px 2px 0;opacity:0;line-height:1}
.tab:hover .tx,.tab[data-on="1"] .tx,.tab .tx:focus-visible{opacity:1}
.tab .tx.arm{color:var(--down);opacity:1}
.addtab{font:500 18px var(--sans);background:none;border:1px dashed var(--line);color:var(--muted);border-radius:6px;width:30px;height:30px;margin:0 0 4px 6px;cursor:pointer;line-height:1}
.addtab:hover{color:var(--fg);border-color:var(--muted)}
.quote{display:grid;justify-items:end;gap:1px}
.qrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.qrow b{font-size:22px;font-weight:500}
.qrow .chg{font-size:14px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.upd{font:12px var(--mono);color:var(--muted)}
.upd.warn{color:var(--warn)}
.icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:0}
.icon:hover{border-color:var(--muted)}
.icon svg{width:17px;height:17px}
.icon:disabled{opacity:.4;cursor:not-allowed}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
/* fila de herramientas */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.grow{flex:1}
.ranges{display:flex;gap:2px}
.ranges button{font:500 12.5px var(--mono);background:none;color:var(--muted);border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
.ranges button:hover{color:var(--fg);background:var(--chip)}
.ranges button[aria-pressed="true"]{color:var(--fg);background:var(--chip)}
.vsep{width:1px;height:22px;background:var(--line)}
.btn{font:500 13px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.drawbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.drawbar .icon[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drawbar .icon.arm{border-color:var(--down);color:var(--down)}
/* gráfico */
.charts{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#mainwrap{position:relative}
#under{position:absolute;inset:0;z-index:0;pointer-events:none}
#main{position:relative;z-index:1;height:max(360px,min(calc(100vh - 330px),760px))}
#ov{position:absolute;inset:0;pointer-events:none;z-index:2;touch-action:none}
#cap{position:absolute;left:0;top:0;z-index:4;cursor:crosshair;touch-action:none}
#rsiwrap{border-top:1px solid var(--line);position:relative}
#rsi{height:150px}
.legend{position:absolute;top:6px;left:8px;z-index:3;font:12px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);pointer-events:none;display:grid;gap:1px;justify-items:start;max-width:calc(100% - 90px)}
.lt{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:2px 4px}
.lt b{font:600 13px var(--sans)}
.lt .k{color:var(--muted)}
.lrow{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:4px;cursor:default;white-space:nowrap}
.lrow:hover,.lrow.on,.lrow:focus-within{background:color-mix(in srgb,var(--chip) 85%,transparent)}
.lrow i{width:12px;height:3px;border-radius:2px;display:inline-block;flex:none}
.lrow .ln{color:var(--muted)}
.lrow .la{display:inline-flex;gap:2px;opacity:0;max-width:0;overflow:hidden}
.lrow:hover .la,.lrow.on .la,.lrow:focus-within .la{opacity:1;max-width:90px}
.lrow .la button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:4px;font-size:12px;line-height:1;padding:3px 6px;cursor:pointer}
#floatBox{position:absolute;z-index:5;display:flex;gap:4px}
#floatBox button{font:500 12.5px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#logBox{position:absolute;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:3px;font:600 12px var(--mono);color:var(--muted);background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);cursor:pointer;user-select:none}
#logBox input{margin:0;width:12px;height:12px}
#logBox:has(input:checked){color:var(--accent)}
 .symbtn{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:0 10px 4px 0;cursor:pointer}
.symbtn:hover{border-color:var(--muted)}
#symPanel{position:fixed;z-index:31;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);width:360px;max-width:calc(100vw - 24px);display:grid;grid-template-rows:auto minmax(0,1fr);max-height:min(70vh,560px)}
#symQ{font:14px var(--sans);background:var(--bg);color:var(--fg);border:0;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;padding:11px 12px;outline-offset:-2px}
#symList{overflow:auto;padding:6px}
.sh{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
.si{display:flex;align-items:center;border-radius:6px}
.si:hover{background:var(--chip)}
.si .sel{flex:1;display:flex;align-items:baseline;gap:8px;text-align:left;background:none;border:0;color:var(--fg);font:500 13.5px var(--mono);padding:7px 8px;cursor:pointer;min-width:0}
.si .sel small{font:11.5px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .sel[aria-current="true"]{color:var(--accent)}
.si .star{background:none;border:0;color:var(--muted);font-size:16px;padding:4px 10px;cursor:pointer}
.si .star[aria-pressed="true"]{color:#f0b33a}
.snote{font-size:12px;color:var(--muted);padding:8px}
#empty{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px;pointer-events:none}
#empty .dl{pointer-events:auto;display:grid;gap:10px;justify-items:center;max-width:420px}
#empty .dl p{margin:0}
.dlmsg{font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--accent);font:12px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
.wsbtn{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--sans);background:none;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:0 6px 4px 0;cursor:pointer;max-width:180px}
.wsbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbtn:hover{color:var(--fg);border-color:var(--muted)}
#wlBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.qrow #wlBtn{order:3}
.area{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
#wl{width:270px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;gap:6px;padding:8px;max-height:calc(100vh - 120px);overflow:auto}
.wlh{display:flex;gap:6px}
.wlh select{flex:1;min-width:0;font:13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.wcols,.wsel{display:grid;grid-template-columns:minmax(0,1.2fr) 1fr .8fr;gap:6px;align-items:baseline}
.wcols{font:500 11px var(--mono);color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:.04em}
.wcols span:not(:first-child),.wsel span{text-align:right}
.wr{display:flex;align-items:center;border-radius:6px}
.wr:hover,.wr[data-on="1"]{background:var(--chip)}
.wsel{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:12.5px var(--mono);padding:7px 6px;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.wsel b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsel .up{color:var(--up)} .wsel .down{color:var(--down)}
.wx{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;opacity:0}
.wr:hover .wx,.wx:focus-visible{opacity:1}
.ptxt{font:13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;box-sizing:border-box}
@media (max-width:900px){.area{grid-template-columns:1fr}#wl{width:auto;max-height:none}}
details.notes{font-size:12.5px;color:var(--muted)}
details.notes summary{cursor:pointer;width:max-content}
details.notes p{margin:6px 0 0;max-width:100ch;line-height:1.5}
/* popover y diálogo */
#pop{position:fixed;z-index:30;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:12px;width:280px;max-width:calc(100vw - 32px);max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:12px}
.pophead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.pophead button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.pf{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.sw input[type=color]{width:30px;height:26px;padding:1px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.seg{display:flex;gap:4px}
.seg button{flex:1;font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 4px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pf label.ck{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:13px}
.pf input[type=range]{width:100%}
.pf input[type=number]{font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
.nrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nrow label{min-width:0}
.nrow input[type=number]{box-sizing:border-box;min-width:0}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:13.5px var(--sans);background:none;color:var(--fg);border:0;border-radius:6px;padding:8px 8px;cursor:pointer}
.mi:hover{background:var(--chip)}
.mi:disabled{opacity:.45;cursor:not-allowed}
.mi .ck{width:16px;color:var(--accent);font-weight:600}
.mi small{margin-left:auto;color:var(--muted);font-size:11.5px}
.pf.menu{gap:0}
#madlg{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 16px 48px rgba(0,0,0,.35)}
#madlg::backdrop{background:rgba(8,10,14,.55)}
#maform{display:grid;gap:14px;padding:18px}
#maform h2{margin:0;font-size:17px;font-weight:600}
.frow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.frow label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.frow select,.frow input[type=number]{font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:80px}
.frow input[type=color]{width:42px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lab{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button{font:12.5px var(--mono);background:var(--chip);color:var(--fg);border:1px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer}
.presets button:hover{border-color:var(--line)}
.presets button:disabled{opacity:.4;cursor:not-allowed}
.dlgact{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.dlgmsg{flex:1;font-size:12.5px;color:var(--down)}
.primary{font:500 13px var(--sans);background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
</style>
<div class="wrap">
  <div class="top">
    <div class="tabs"><button type="button" class="wsbtn" id="wsBtn" aria-haspopup="menu" title="Espacios de trabajo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span id="wsName">Principal</span></button><button type="button" class="symbtn" id="symBtn" aria-haspopup="dialog" title="Cambiar de activo"><b id="symName">BTC/USDT</b><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button><div class="tabs" role="tablist" aria-label="Temporalidades" id="tabs"></div><button type="button" class="addtab" id="addTab" aria-label="Añadir pestaña con otra temporalidad" title="Añadir pestaña">+</button></div>
    <div class="quote">
      <div class="qrow"><b id="last">—</b><span id="chg" class="chg"></span>
        <button type="button" class="icon" id="wlBtn" aria-pressed="false" title="Watchlist" aria-label="Mostrar u ocultar la watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button><button type="button" class="icon" id="refresh" title="Actualizar precios" aria-label="Actualizar precios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
      <div class="upd" id="upd" role="status"></div>
    </div>
  </div>
  <div class="bar">
    <div class="ranges" role="group" aria-label="Periodo visible" id="ranges"></div>
    <span class="vsep"></span>
    <button type="button" class="btn" id="indBtn" aria-haspopup="menu"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 3 7-9"/><path d="M3 21h18"/></svg>Indicadores<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="grow"></span>
    <div class="drawbar" role="toolbar" aria-label="Herramientas de dibujo">
      <button type="button" class="icon" data-tool="cursor" aria-pressed="true" title="Cursor: seleccionar y mover (Esc)" aria-label="Cursor"><svg viewBox="0 0 16 16"><path d="M3 2l9 5-4 1 3 5-2 1-3-5-3 3z" fill="currentColor"/></svg></button>
      <button type="button" class="icon" data-tool="line" aria-pressed="false" title="Línea de tendencia" aria-label="Línea de tendencia"><svg viewBox="0 0 16 16"><path d="M2.5 13L13.5 3" stroke="currentColor" stroke-width="1.6"/><circle cx="2.5" cy="13" r="1.8" fill="currentColor"/><circle cx="13.5" cy="3" r="1.8" fill="currentColor"/></svg></button>
      <button type="button" class="icon" data-tool="hline" aria-pressed="false" title="Línea horizontal" aria-label="Línea horizontal"><svg viewBox="0 0 16 16"><path d="M1 8h14" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button type="button" class="icon" data-tool="vline" aria-pressed="false" title="Línea vertical" aria-label="Línea vertical"><svg viewBox="0 0 16 16"><path d="M8 1v14" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button type="button" class="icon" data-tool="measure" aria-pressed="false" title="Medir precio, % y tiempo" aria-label="Medir"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4v8M2 8h12" stroke="currentColor" stroke-width="1"/></svg></button>
      <button type="button" class="icon" data-tool="long" aria-pressed="false" title="Posición larga" aria-label="Posición larga"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="7" fill="var(--up)" opacity=".6"/><rect x="2" y="9" width="12" height="4" fill="var(--down)" opacity=".6"/></svg></button>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
const HOUR=3600, DAY=86400, WEEK=604800;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let PREC=1; // decimales del precio según el activo
const fmt=(x,d)=>{if(d==null)d=PREC;return x==null||isNaN(x)?'—':x.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d})};
const calcPrec=c=>c>=1000?1:c>=10?2:c>=1?3:c>=0.01?4:c>=0.0001?6:8;
const fdate=(t,h)=>new Date(t*1000).toLocaleString('es-ES',h?{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}:{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})+(h?' UTC':'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toRows=o=>o.t.map((t,i)=>[t,o.o[i],o.h[i],o.l[i],o.c[i],o.v?o.v[i]:0]);
let BASE={h1:[],d1:[]},SNAPEND={h1:0,d1:0},INDEX={symbols:[]};

// ── temporalidades (formato inglés) ──
const hk=h=>t=>Math.floor(t/(h*HOUR))*h*HOUR;
const TFM={
  '1H':{bar:HOUR,key:hk(1)},'2H':{bar:2*HOUR,key:hk(2)},'4H':{bar:4*HOUR,key:hk(4)},'6H':{bar:6*HOUR,key:hk(6)},'12H':{bar:12*HOUR,key:hk(12)},
  '1D':{bar:DAY,key:t=>Math.floor(t/DAY)*DAY},'3D':{bar:3*DAY,key:t=>Math.floor(t/(3*DAY))*3*DAY},
  '1W':{bar:WEEK,key:t=>{const d=Math.floor(t/DAY);return (d-(d+3)%7)*DAY}}, // semanas lunes-domingo UTC
  '1M':{bar:30.44*DAY,key:t=>{const d=new Date(t*1000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)/1000}}
};
const TFS=Object.keys(TFM), RANK=tf=>TFM[tf].bar;
function resample(rows,key){const out=[];for(const r of rows){const k=key(r[0]);const L=out[out.length-1];
  if(L&&L[0]===k){if(r[2]>L[2])L[2]=r[2];if(r[3]<L[3])L[3]=r[3];L[4]=r[4];L[5]+=r[5]||0}else out.push([k,r[1],r[2],r[3],r[4],r[5]||0])}return out}
let cache={};
function tfRows(tf){if(cache['r'+tf])return cache['r'+tf];
  const src=TFM[tf].bar<DAY?BASE.h1:BASE.d1;
  return cache['r'+tf]=(tf==='1H'||tf==='1D')?src:resample(src,TFM[tf].key)}

// ── cálculos ──
function ema(x,n){const o=new Array(x.length).fill(null);if(x.length<n)return o;let s=0;for(let i=0;i<n;i++)s+=x[i];o[n-1]=s/n;const a=2/(n+1);for(let i=n;i<x.length;i++)o[i]=a*x[i]+(1-a)*o[i-1];return o}
function rsi(x,n=14){const o=new Array(x.length).fill(null);if(x.length<=n)return o;let au=0,ad=0;for(let i=1;i<=n;i++){const d=x[i]-x[i-1];au+=Math.max(d,0);ad+=Math.max(-d,0)}au/=n;ad/=n;o[n]=ad===0?100:100-100/(1+au/ad);
  for(let i=n+1;i<x.length;i++){const d=x[i]-x[i-1];au=(au*(n-1)+Math.max(d,0))/n;ad=(ad*(n-1)+Math.max(-d,0))/n;o[i]=ad===0?100:100-100/(1+au/ad)}return o}
// Media de una temporalidad igual o mayor que la del gráfico: dentro de una vela mayor aún abierta usa el cierre
// de cada vela del gráfico como cierre provisional (lo que se veía en ese momento, sin mirar al futuro).
function htf(spec){const k='m'+spec.type+spec.len+spec.tf;if(cache[k])return cache[k];
  const H=tfRows(spec.tf),C=H.map(r=>r[4]),P=[0];C.forEach(c=>P.push(P[P.length-1]+c));
  return cache[k]={kIdx:new Map(H.map((r,i)=>[r[0],i])),P,E:spec.type==='EMA'?ema(C,spec.len):null}}
function maOnChart(rows,spec){
  const {kIdx,P,E}=htf(spec),n=spec.len,a=2/(n+1),key=TFM[spec.tf].key;
  return rows.map(r=>{const k=kIdx.get(key(r[0]));if(k==null||k<n-1)return null;const x=r[4];
    if(spec.type==='SMA'||k===n-1)return (P[k]-P[k-n+1]+x)/n;
    return a*x+(1-a)*E[k-1]});
}

// ── estado (por pestaña; se guarda en este navegador) ──
const PALETTE=['#f0a31a','#3b82f6','#ec4899','#14b8a6','#8b5cf6','#f97316','#64748b','#84cc16'];
const defBm=()=>({sma:'',ema:'',fill:true,op:0.22,width:2});
function defPer(tf){return {mas:tf==='1H'?[{type:'EMA',len:50,tf:'1H',color:'#f0a31a'}]:tf==='1D'?[{type:'EMA',len:50,tf:'1D',color:'#f0a31a'}]:tf==='1W'?[{type:'SMA',len:200,tf:'1W',color:'#3b82f6'}]:[],
  bmsb:true,bm:defBm(),hl:true,hlc:{hi:'',lo:''},drawsBy:{},log:false,rsi:{on:true,len:14,color:'',width:2,ob:70,os:30,lw:1,ls:2,lc:'',mid:true,mv:50,mw:1,ms:2,mc:''},halv:{on:tf==='1W',hw:[40,80,110]},vol:{on:true,h:20,op:0.5,ma:true,maLen:20,maCol:''}}}
let S=null;
try{S=JSON.parse(localStorage.getItem('btc-graficos-v2'))}catch(e){}
if(!S||!Array.isArray(S.tabs)||!S.per){
  S={tab:'d1',tabs:[{id:'h1',tf:'1H'},{id:'d1',tf:'1D'},{id:'w1',tf:'1W'}],per:{},cup:'',cdn:'',dcol:''};
  let o=null;try{o=JSON.parse(localStorage.getItem('btc-graficos-v1'))}catch(e){} // versión anterior
  S.tabs.forEach(({id,tf})=>{const p=defPer(tf),op=o&&o.per&&o.per[id];
    if(o){if(o.mas&&Array.isArray(o.mas[id]))p.mas=o.mas[id];if(o.log)p.log=!!o.log[id];if(o.tab)S.tab=o.tab;S.cup=o.cup||'';S.cdn=o.cdn||'';S.dcol=o.dcol||'';
      if(id==='w1'){p.halv={on:o.halv!==false,hw:Array.isArray(o.hw)?o.hw:[40,80,110]}}}
    if(op){p.bmsb=op.bmsb!==false;p.bm={...defBm(),...(op.bm||{})};p.hl=op.hl!==false;p.drawsBy={BTC:Array.isArray(op.draws)?op.draws:[]}}
    S.per[id]=p});
}
function normS(S){
  if(!S||!Array.isArray(S.tabs))S={tab:'d1',tabs:[{id:'h1',tf:'1H'},{id:'d1',tf:'1D'},{id:'w1',tf:'1W'}],per:{},cup:'',cdn:'',dcol:'',sym:'BTC',cdc:'BTC_USDT'};
  if(!S.per)S.per={};
  S.tabs=S.tabs.filter(t=>TFM[t.tf]);if(!S.tabs.length)S.tabs=[{id:'d1',tf:'1D'}]; 
  S.tabs.forEach(t=>{S.per[t.id]={...defPer(t.tf),...(S.per[t.id]||{})};const p=S.per[t.id];if(Array.isArray(p.draws)){p.drawsBy={BTC:p.draws};delete p.draws}if(!p.drawsBy||typeof p.drawsBy!=='object')p.drawsBy={};p.bm={...defBm(),...p.bm};p.rsi={...defPer(t.tf).rsi,...p.rsi};p.halv={...defPer(t.tf).halv,...p.halv};p.hlc={hi:'',lo:'',...p.hlc};p.vol={...defPer(t.tf).vol,...p.vol}}); 
  if(!S.tabs.some(t=>t.id===S.tab))S.tab=S.tabs[0].id; 
  if(!S.sym){S.sym='BTC';S.cdc='BTC_USDT'} 
  return S}
const newS=()=>normS(null);
// Espacios de trabajo: cada uno guarda sus pestañas, indicadores, dibujos y activo. Se guardan en este navegador y en la base de datos del artefacto.
let WS=null;try{WS=JSON.parse(localStorage.getItem('btc-graficos-ws'))}catch(e){}
if(!WS||!WS.data||!Array.isArray(WS.list)||!WS.list.length){WS={cur:'ws1',list:[{id:'ws1',name:'Principal'}],data:{ws1:S},updatedAt:0}}
if(!WS.list.some(x=>x.id===WS.cur))WS.cur=WS.list[0].id;
S=normS(WS.data[WS.cur]);WS.data[WS.cur]=S;
let wsTimer=0;
const save=()=>{WS.data[WS.cur]=S;WS.updatedAt=Date.now();try{localStorage.setItem('btc-graficos-ws',JSON.stringify(WS))}catch(e){};clearTimeout(wsTimer);wsTimer=setTimeout(syncWs,1500)};
function syncWs(ids){if(!dbRef)return;(ids||[WS.cur]).forEach(id=>{const st=WS.data[id];if(st)dbRef.doc('workspaces/'+id).set({state:JSON.stringify(st),updatedAt:WS.updatedAt}).catch(()=>{})});
  dbRef.doc('config/workspaces').set({cur:WS.cur,list:WS.list,updatedAt:WS.updatedAt}).catch(()=>{})}

const P=()=>S.per[S.tab];
const DR=()=>{const b=P().drawsBy;return b[S.sym]||(b[S.sym]=[])};
const quoteCcy=()=>'USDT';
const isIndex=()=>{const i=INDEX.symbols.find(x=>x.sym===S.sym);return i&&i.type==='index'?i:null};
const isYahoo=()=>{const i=INDEX.symbols.find(x=>x.sym===S.sym);return (i&&(i.type==='index'||i.type==='stock'))||(!i&&S.stype==='stock')};
const symLabel=()=>{const i=isIndex();return i?i.name:isYahoo()?S.sym:S.sym+'/'+quoteCcy()};
const title=()=>isYahoo()?`${symLabel()} · ${curTf()} · Yahoo Finance`:`${symLabel()} · ${curTf()} · Binance`;
const curTf=()=>S.tabs.find(t=>t.id===S.tab).tf;
const barSec=()=>TFM[curTf()].bar;
const hasTime=()=>barSec()<DAY;
const bmCol=k=>P().bm[k]||css(k==='sma'?'--bmsb-sma':'--bmsb-ema');
const rsiCol=()=>P().rsi.color||css('--rsi');
const upC=()=>S.cup||css('--up'), dnC=()=>S.cdn||css('--down');
const DASH={0:'',1:'2 4',2:'8 5'};

// ── gráficos ──
const opts=()=>({autoSize:true,layout:{background:{type:'solid',color:css('--panel')},textColor:css('--muted'),fontFamily:css('--mono'),fontSize:11},
  grid:{vertLines:{color:css('--grid')},horzLines:{color:css('--grid')}},rightPriceScale:{borderColor:css('--line')},
  timeScale:{borderColor:css('--line'),rightOffset:4,timeVisible:hasTime()},crosshair:{mode:0},localization:{locale:'es-ES'}});
const optsMain=()=>{const o=opts();o.layout.background={type:'solid',color:'rgba(0,0,0,0)'};return o}; // transparente: el relleno de la BMSB va debajo
const mainEl=$('main'), ov=$('ov'), under=$('under');
const main=LightweightCharts.createChart(mainEl,optsMain());
const rc=LightweightCharts.createChart($('rsi'),opts());
const cs=main.addCandlestickSeries({borderVisible:false,priceLineVisible:true});
const lo={lineWidth:2,priceLineVisible:false,crosshairMarkerVisible:false};
const sWs=main.addLineSeries({...lo,lineType:1}), sWe=main.addLineSeries({...lo,lineType:1});
const sR=rc.addLineSeries({lineWidth:2,priceLineVisible:false,crosshairMarkerVisible:false});
const sV=main.addHistogramSeries({priceScaleId:'vol',priceFormat:{type:'volume'},lastValueVisible:false,priceLineVisible:false});
const sVm=main.addLineSeries({priceScaleId:'vol',lineWidth:1,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
const rgba=(c,a)=>{const m=/^#?([0-9a-f]{6})$/i.exec(String(c).trim());if(!m)return c;const n=parseInt(m[1],16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
const fmtVol=v=>v==null||isNaN(v)?'—':v>=1e9?fmt(v/1e9,2)+' B':v>=1e6?fmt(v/1e6,2)+' M':v>=1e3?fmt(v/1e3,2)+' K':fmt(v,2);
let VOLMA=[];const VR={};
let pl=[];
function applyStyles(){
  const p=P(),pf={priceFormat:{type:'price',precision:PREC,minMove:Math.pow(10,-PREC)}};
  [cs,sWs,sWe,...maSeries].forEach(x=>x.applyOptions(pf));
  cs.applyOptions({upColor:upC(),downColor:dnC(),wickUpColor:upC(),wickDownColor:dnC()});
  sWs.applyOptions({color:bmCol('sma'),lineWidth:p.bm.width,visible:p.bmsb});sWe.applyOptions({color:bmCol('ema'),lineWidth:p.bm.width,visible:p.bmsb});
  sR.applyOptions({color:rsiCol(),lineWidth:p.rsi.width});
  pl.forEach(x=>sR.removePriceLine(x));
  const r=p.rsi;pl=[[r.ob,r.lw,r.ls,r.lc||css('--muted')],[r.os,r.lw,r.ls,r.lc||css('--muted')]].concat(r.mid?[[r.mv,r.mw,r.ms,r.mc||css('--line')]]:[]).map(([v,w,st,c])=>sR.createPriceLine({price:v,lineWidth:w,lineStyle:st,axisLabelVisible:true,title:'',color:c}));
  $('rsiwrap').hidden=!p.rsi.on;
  main.priceScale('vol').applyOptions({scaleMargins:{top:1-p.vol.h/100,bottom:0},visible:false});
  sV.applyOptions({visible:p.vol.on});sVm.applyOptions({visible:p.vol.on&&p.vol.ma,color:p.vol.maCol||css('--muted')});
  if(R.length>1)sV.setData(R.map(r=>({time:r[0],value:r[5]||0,color:rgba(r[4]>=r[1]?upC():dnC(),p.vol.op)})));
}
function paint(){main.applyOptions(optsMain());rc.applyOptions(opts());rc.applyOptions({rightPriceScale:{scaleMargins:{top:0.1,bottom:0.1}}});applyStyles();drawSoon()}
let lock=false;
const sync=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(lock||!r)return;lock=true;b.timeScale().setVisibleLogicalRange(r);lock=false});
sync(main,rc); sync(rc,main);

const HALV=[{n:2,t:Date.UTC(2016,6,9)/1000},{n:3,t:Date.UTC(2020,4,11)/1000},{n:4,t:Date.UTC(2024,3,20)/1000},{n:5,t:Date.UTC(2028,3,10)/1000,proj:true}];
let R=[],T=[],idx=new Map(),n=0,RS=[],BW=[[],[]],MAV=[],maSeries=[],rangeDays=null,VIS={hi:null,lo:null};
function render(keepView){
  const tf=curTf(),p=P();
  R=tfRows(tf); n=R.length-1; T=R.map(r=>r[0]); idx=new Map(T.map((t,i)=>[t,i]));
  $('symName').textContent=symLabel();
  if(R.length<2){[cs,sR,sWs,sWe,sV,sVm].forEach(x=>x.setData([]));maSeries.forEach(x=>main.removeSeries(x));maSeries=[];MAV=[];IND=[];
    $('empty').hidden=false;lg.innerHTML=`<div class="lt"><b>${esc(title())}</b></div>`;lgr.innerHTML='';$('last').textContent='—';$('chg').textContent='';drawSoon();return}
  $('empty').hidden=true;
  const view=keepView?main.timeScale().getVisibleLogicalRange():null;
  const ws=[]; if(p.halv.on&&barSec()>=DAY){const end=Date.UTC(2030,11,31)/1000;let t=T[n];
    for(let k=0;k<3000;k++){t=tf==='1M'?Date.UTC(new Date(t*1000).getUTCFullYear(),new Date(t*1000).getUTCMonth()+1,1)/1000:t+barSec();if(t>end)break;ws.push({time:t})}}
  const line=a=>a.map((v,i)=>v==null?{time:T[i]}:{time:T[i],value:v});
  cs.setData(R.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4]})).concat(ws));
  RS=rsi(R.map(r=>r[4]),p.rsi.len); sR.setData(line(RS).concat(ws));
  {const vv=R.map(r=>r[5]||0),k=p.vol.maLen;let sm=0;VOLMA=vv.map((v,i)=>{sm+=v;if(i>=k)sm-=vv[i-k];return i>=k-1?sm/k:null});sVm.setData(line(VOLMA))}
  BW=[maOnChart(R,{type:'SMA',len:20,tf:'1W'}),maOnChart(R,{type:'EMA',len:21,tf:'1W'})];
  sWs.setData(line(BW[0])); sWe.setData(line(BW[1]));
  maSeries.forEach(s=>main.removeSeries(s)); maSeries=[]; MAV=[];
  p.mas.forEach(m=>{const s=main.addLineSeries({...lo,color:m.color,lineWidth:m.width||2,lineStyle:m.style||0,lastValueVisible:true});const v=maOnChart(R,m);s.setData(line(v));maSeries.push(s);MAV.push(v)});
  main.priceScale('right').applyOptions({mode:p.log?1:0}); $('tLog').checked=!!p.log;
  applyStyles(); quote(); buildLegend();
  if(view) main.timeScale().setVisibleLogicalRange(view); else setRange(rangeDays==null?rangesFor(tf).def:rangeDays);
  drawSoon();
}

// ── precio arriba a la derecha ──
function quote(){const last=R[n],prev=R[n-1]||last,ch=(last[4]/prev[4]-1)*100;

    fetch(`data/${it.sym}_1d.json`).then(r=>r.ok?r.json():null).then(o=>{if(o&&o.c&&o.c.length>1){const a=o.c[o.c.length-1],b=o.c[o.c.length-2];FQ[it.sym]={q:{last:a,ch:(a/b-1)*100}};renderWl()}}).catch(()=>{})}
  return null}
const FQ={};
const fmtQ=x=>x==null?'—':fmt(x,calcPrec(x));
function renderWl(){
  wlEl.hidden=!S.wlOpen;$('wlBtn').setAttribute('aria-pressed',String(!!S.wlOpen));if(!S.wlOpen)return;
  wlSel.innerHTML=WL.lists.map(l=>`<option value="${esc(l.id)}" ${l.id===WL.cur?'selected':''}>${esc(l.name)} (${l.symbols.length})</option>`).join('');
  const W=curList().symbols;
  wlRows.innerHTML=W.length?W.map((it,j)=>{const q=quoteOf(it),i=infoOf(it.sym),nm=i&&i.type==='index'?i.name:it.sym;
    return `<div class="wr" data-on="${it.sym===S.sym?1:0}"><button type="button" class="wsel" data-j="${j}"><b>${esc(nm)}</b><span>${fmtQ(q&&q.last)}</span><span class="${q&&q.ch!=null?(q.ch>=0?'up':'down'):''}">${q&&q.ch!=null?(q.ch>=0?'+':'')+fmt(q.ch,2)+'%':'—'}</span></button><button type="button" class="wx" data-x="${j}" aria-label="Quitar ${esc(nm)} de la lista" title="Quitar">×</button></div>`}).join('')
    :`<div class="snote">Lista vacía. Pulsa «+ Añadir activo» o ☆ en el buscador.</div>`;
}
$('wlBtn').addEventListener('click',()=>{S.wlOpen=!S.wlOpen;save();renderWl();startTickers()});
wlSel.addEventListener('change',()=>{WL.cur=wlSel.value;saveWatch()});
wlRows.addEventListener('click',e=>{const W=curList().symbols,x=e.target.closest('[data-x]');
  if(x){W.splice(+x.dataset.x,1);saveWatch();return}
  const b=e.target.closest('[data-j]');if(!b)return;const it=W[+b.dataset.j];if(!it)return;
  S.sym=it.sym;S.cdc='';S.stype=it.type||'crypto';save();loadSymbol()});
$('wlAdd').addEventListener('click',()=>openSym());
function askName(anchor,title,val,done){let v=val;openPop(anchor,title,[{kind:'text',label:'Nombre',get:()=>v,set:x=>{v=x},enter:()=>{if(v.trim()){closePop();done(v.trim().slice(0,40))}}},
  {kind:'button',label:'Guardar',run:()=>{if(v.trim()){closePop();done(v.trim().slice(0,40))}}}])}
let delArm=0;
$('wlMenu').addEventListener('click',e=>{const a=e.currentTarget,L=curList();
  openPop(a,'Listas',[
    {kind:'item',label:'Nueva lista…',run:()=>askName(a,'Nueva lista','',nm=>{const id='l'+Date.now().toString(36);WL.lists.push({id,name:nm,symbols:[]});WL.cur=id;saveWatch()})},
    {kind:'item',label:'Renombrar «'+L.name+'»…',run:()=>askName(a,'Renombrar lista',L.name,nm=>{L.name=nm;saveWatch()})},
    {kind:'item',label:Date.now()-delArm<4000?'¿Eliminar «'+L.name+'»? Pulsa otra vez':'Eliminar «'+L.name+'»',disabled:WL.lists.length<2,run:()=>{
      if(Date.now()-delArm<4000){delArm=0;WL.lists=WL.lists.filter(x=>x!==L);WL.cur=WL.lists[0].id;closePop();saveWatch()}else{delArm=Date.now();$('wlMenu').click()}}}])});
// ── espacios de trabajo: menú ──
const wsBtn=$('wsBtn');
function wsName(){const w=WS.list.find(x=>x.id===WS.cur);return w?w.name:'Espacio'}
function applyWorkspace(id){clearTimeout(wsTimer);syncWs();WS.cur=id;S=normS(WS.data[id]);WS.data[id]=S;
  save();$('wsName').textContent=wsName();closePop();closeSym();selectTab(S.tab);renderWl();startTickers();loadSymbol()}
let wsDelArm=0;
function wsMenu(){const cur=WS.list.find(x=>x.id===WS.cur);
  const add=(state,nm)=>{const id='ws'+Date.now().toString(36);WS.list.push({id,name:nm});WS.data[id]=state;applyWorkspace(id);syncWs([id])};
  openPop(wsBtn,'Espacios de trabajo',[
    ...WS.list.map(w=>({kind:'item',label:w.name,checked:w.id===WS.cur,run:()=>{if(w.id!==WS.cur)applyWorkspace(w.id);else closePop()}})),
    {kind:'item',label:'Nuevo espacio vacío…',run:()=>askName(wsBtn,'Nuevo espacio','',nm=>add(newS(),nm))},
    {kind:'item',label:'Duplicar este espacio…',run:()=>askName(wsBtn,'Duplicar espacio',cur.name+' (copia)',nm=>add(JSON.parse(JSON.stringify(S)),nm))},
    {kind:'item',label:'Renombrar «'+cur.name+'»…',run:()=>askName(wsBtn,'Renombrar espacio',cur.name,nm=>{cur.name=nm;$('wsName').textContent=nm;save()})},
    {kind:'item',label:Date.now()-wsDelArm<4000?'¿Eliminar «'+cur.name+'»? Pulsa otra vez':'Eliminar «'+cur.name+'»',disabled:WS.list.length<2,run:()=>{
      if(Date.now()-wsDelArm<4000){wsDelArm=0;const id=WS.cur;WS.list=WS.list.filter(x=>x.id!==id);delete WS.data[id];if(dbRef)dbRef.doc('workspaces/'+id).delete().catch(()=>{});applyWorkspace(WS.list[0].id)}
      else{wsDelArm=Date.now();wsMenu()}}}])}
wsBtn.addEventListener('click',()=>{if(!$('pop').hidden&&popAnchor===wsBtn)closePop();else wsMenu()});
$('wsName').textContent=wsName();
async function loadWorkspacesFromDb(){if(!dbRef)return false;
  try{const sn=await withTimeout(dbRef.doc('config/workspaces').get(),8000);if(!sn||!sn.exists){syncWs(WS.list.map(w=>w.id));return false}
    const d=sn.data()||{};if(!Array.isArray(d.list)||!d.list.length||(d.updatedAt||0)<=(WS.updatedAt||0)){syncWs(WS.list.map(w=>w.id));return false}
    const data={};for(const w of d.list){const x=await withTimeout(dbRef.doc('workspaces/'+w.id).get(),8000);if(x&&x.exists){try{data[w.id]=JSON.parse((x.data()||{}).state)}catch(e){}}}
    const list=d.list.filter(w=>data[w.id]);if(!list.length)return false;
    WS={cur:list.some(w=>w.id===d.cur)?d.cur:list[0].id,list,data,updatedAt:d.updatedAt};S=normS(WS.data[WS.cur]);WS.data[WS.cur]=S;
    try{localStorage.setItem('btc-graficos-ws',JSON.stringify(WS))}catch(e){}$('wsName').textContent=wsName();return true}catch(e){return false}}
// arranque
showStatus();
(async()=>{
  const [idx,bl,st]=await Promise.all(['data/index.json','data/binance.json','data/stocks.json'].map(u=>fetch(u,{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null)));
  if(idx&&Array.isArray(idx.symbols))INDEX=idx;BINL=Array.isArray(bl)?bl:[];STK=Array.isArray(st)?st:[];
  if(!infoOf(S.sym)&&!BINL.includes(S.sym)){S.sym='BTC';S.stype='crypto'}
  await loadWatch();renderWl();startTickers();loadSymbol();
})();
})();
</script>
