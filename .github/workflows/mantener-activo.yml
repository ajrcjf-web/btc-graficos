name: Mantener activas las tareas programadas

# GitHub pausa las tareas programadas de un repositorio público tras 60 días sin actividad.
# Este flujo hace un commit mínimo cada mes para evitarlo.
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Mantener activas las tareas programadas" || exit 0
          git push
